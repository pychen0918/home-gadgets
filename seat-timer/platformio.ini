; Seat timer: ESP32-WROOM-32E + LD2410C + Waveshare 2.66" e-paper
; Pick the env matching your panel: color* for the 4-colour (G) panel,
; mono* for the black/white panel. *-demo shortens all times for bench tests.
[platformio]
default_envs = color

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; 3 MB app partition (no OTA): Wi-Fi + TLS + fonts need more than the default 1.3 MB
board_build.partitions = huge_app.csv
lib_deps =
  ncmreynolds/ld2410
  adafruit/Adafruit NeoPixel
  zinggjm/GxEPD2
  bblanchon/ArduinoJson@^7

; 4-colour panel, normal use: 30-minute limit
[env:color]
build_flags = -DPANEL_COLOR

; 4-colour panel, bench test: 60-second limit, 20-second break, 10-second repeat
[env:color-demo]
build_flags = -DPANEL_COLOR -DDEMO_MODE

; Black/white panel, normal use
[env:mono]
build_flags = -DPANEL_MONO

; Black/white panel, bench test
[env:mono-demo]
build_flags = -DPANEL_MONO -DDEMO_MODE
